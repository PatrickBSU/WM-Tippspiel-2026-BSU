name: Ergebnis-Sync

on:
  schedule:
    - cron: "*/10 * * * *"
  workflow_dispatch:

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - name: Sync-Endpoint aufrufen
        run: |
          code=$(curl -s -o resp.json -w "%{http_code}" \
            -H "Authorization: Bearer ${{ secrets.CRON_SECRET }}" \
            https://wm-tippspiel-2026-bsu.vercel.app/api/cron/update-results)
          cat resp.json
          echo
          echo "HTTP $code"
          test "$code" = "200"
